name: Bug report
description: Report a reproducible greprules CLI or agent plugin bug.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include secrets, private source code, or non-public vulnerability details.
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - CLI
        - Claude Code plugin
        - Codex plugin
        - Hermes plugin
        - Release packaging
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: greprules version
      description: Run `greprules version` or include the plugin manifest version.
      placeholder: v0.2.5
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, agent version, and shell if relevant.
      placeholder: macOS 15, arm64, Codex desktop, zsh
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: List the smallest set of commands or agent actions that reproduce the problem.
      placeholder: |
        1. Install plugin...
        2. Run setup...
        3. Run scan...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include relevant logs or command output. Redact secrets and private paths if needed.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: Include OpenGrep mode, registry URL, plugin settings, or `.greprules` files if relevant.
      render: yaml
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I have removed secrets, tokens, and private vulnerability details.
          required: true
        - label: This is not a private security vulnerability report.
          required: true
