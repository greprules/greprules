name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/greprules
      - run: python3 -m py_compile __init__.py plugins/hermes/__init__.py plugins/codex/scripts/greprules-hook.py plugins/claude-code/scripts/greprules-hook.py
