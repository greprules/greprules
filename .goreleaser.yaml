version: 2

project_name: greprules

before:
  hooks:
    - go mod tidy

builds:
  - id: greprules
    main: ./cmd/greprules
    binary: greprules
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    builds:
      - greprules
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - .claude-plugin/**
      - plugins/**

checksum:
  name_template: checksums.txt

release:
  replace_existing_artifacts: true
  mode: replace

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
